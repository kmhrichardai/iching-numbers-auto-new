<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八星磁場分析 - Apple Pro Edition</title>
    <!-- 引入外部 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- 歷史紀錄面板 -->
    <div id="historyPanel" class="history-panel">
        <div class="history-header">
            <h2 class="history-title">搜尋紀錄</h2>
            <div>
                <button class="clear-all-btn" id="btn-clear-history">清除全部</button>
                <button class="close-history-btn" id="btn-close-history" style="margin-left: 10px;">✕</button>
            </div>
        </div>
        <!-- 歷史紀錄清單，由 JS 動態生成 -->
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- 頂部控制區 -->
    <div class="top-left-controls">
        <button class="icon-btn" id="btn-open-history" title="搜尋歷史">🕒</button>
    </div>
    <div class="top-right-controls">
        <button class="icon-btn" id="builderToggleBtn" title="開啟智慧選號模式">🎯</button>
        <button class="icon-btn" id="themeToggleBtn" title="切換深淺模式">🌙</button>
    </div>

    <!-- 標題與輸入框 -->
    <div class="top-section">
        <div class="header">
            <h1>數字磁場分析</h1>
            <p>Pro Edition</p>
        </div>
        
        <div class="input-card">
            <div class="input-wrapper">
                <input type="text" id="numInput" placeholder="輸入號碼 (支援車牌/英文名)" value="">
                <div class="clear-btn" id="clearBtn">✕</div>
            </div>
        </div>
    </div>

    <!-- 中間滑動區與分析結果 -->
    <div class="scroll-area">
        <!-- 智慧配號面板 -->
        <div id="builderPanel" class="builder-panel">
            <div class="builder-row">
                <span class="builder-label">限制目標長度 (字數)</span>
                <input type="number" id="builderMaxLen" value="8" min="2" max="20" class="builder-input-small">
            </div>
            <div class="builder-label" style="margin-top: 12px; margin-bottom: 2px;">允許產生的磁場 (點擊勾選)</div>
            <div class="star-pills" id="starPills"></div>
            <div id="builderSuggestions" class="builder-suggestions"></div>
        </div>

        <div id="conversionHint" class="conversion-hint"></div>
        
        <!-- 卡片清單區域 -->
        <div id="resultList"></div>
        
        <!-- 統計與流向 -->
        <div id="statsArea" class="stats-card">
            <span class="stats-text-primary" id="statRatio">📊 吉 0% / 凶 0%</span>
            <span class="stats-text-secondary" id="statFlow">🔄 -</span>
        </div>
    </div>

    <!-- 底部操作區 -->
    <div class="footer-action" id="copyArea">
        <div class="action-row">
            <div class="select-wrapper">
                <select id="modeSelect" class="mode-select">
                    <option value="ai">模式：AI 專業</option>
                    <option value="client">模式：客戶簡報</option>
                    <option value="numbers">模式：純數字</option>
                </select>
            </div>
            <button class="copy-btn" id="btn-copy">複製</button>
        </div>
        
        <div id="previewContainer" class="preview-box">
            <div id="formattedText" class="preview-text"></div>
        </div>
    </div>
</div>

<!-- 引入外部 JavaScript 檔案 -->
<script src="app.js"></script>
</body>
</html>
